name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<10"

      - name: Check packaged skill synchronization
        run: python scripts/sync_codex_plugin_skill.py --check

      - name: Run tests
        run: python -m pytest -q
